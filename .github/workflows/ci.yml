name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# testing.md: unit + integration tiers are offline by design (fake-provider
# only). The contract tier needs real provider binaries and never runs here.
env:
  CI: "true"

jobs:
  verify:
    name: format, lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # semantic-release publishes to npm and cuts a GitHub Release + tag. It does
  # NOT commit the bumped version back to the repo: the `main` ruleset requires
  # a PR for every push, which blocks @semantic-release/git. The published
  # package always carries the right version; the in-repo package.json version
  # is only a floor and drifts between releases — that is expected.
  release:
    name: release to npm
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag, cut the GitHub Release
      issues: write # semantic-release comments on the issues/PRs it closes
      pull-requests: write
      id-token: write # npm publish provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
