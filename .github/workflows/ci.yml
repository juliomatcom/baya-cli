name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# testing.md: unit + integration tiers are offline by design (fake-provider
# only). The contract tier needs real provider binaries and never runs here.
env:
  CI: "true"

jobs:
  verify:
    name: format, lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
